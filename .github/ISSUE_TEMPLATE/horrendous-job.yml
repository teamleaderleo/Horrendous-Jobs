name: Nominate a horrendous job
description: Submit a public job posting with a spectacular effort-to-reward ratio.
title: "[Nomination] "
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome to the intake desk
        Bring evidence. The target is the **posting**, never the worker doing the job.

        The strongest nominations combine broad responsibility, thin authority, relentless coordination, urgency, credential inflation, after-hours exposure, and ordinary compensation.

  - type: input
    id: company
    attributes:
      label: Company
      placeholder: Example Corp
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: Role
      placeholder: Senior Coordinator of Everything
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      placeholder: Toronto, ON, Canada
    validations:
      required: true

  - type: input
    id: pay
    attributes:
      label: Advertised pay
      description: Copy the salary or hourly range exactly as advertised, including currency when known.
      placeholder: CAD $45,000–$55,000/year
    validations:
      required: true

  - type: dropdown
    id: employment-type
    attributes:
      label: Employment type
      options:
        - Full-time
        - Part-time
        - Contract
        - Temporary
        - Internship
        - Casual / on-call
        - Other / unclear
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Public source URL
      description: Link directly to the employer posting or reputable job board when possible.
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: observed
    attributes:
      label: Date observed
      description: Use YYYY-MM-DD.
      placeholder: "2026-09-07"
    validations:
      required: true

  - type: textarea
    id: responsibilities
    attributes:
      label: Advertised responsibilities
      description: Summarize the major duties. Bullets are ideal. Short excerpts are welcome when the wording is especially revealing.
      placeholder: |
        - Own three concurrent client programs
        - Coordinate Legal, Finance, Sales, vendors, and executives
        - Handle live escalations and weekend events
        - Maintain the canonical tracker, naturally
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Advertised requirements
      description: Experience, education, certifications, travel, availability, physical requirements, software, etc.
      placeholder: |
        - Bachelor's degree
        - 4–6 years of experience
        - Evening/weekend availability
    validations:
      required: true

  - type: textarea
    id: case
    attributes:
      label: Why is this horrendous?
      description: Make the case in a few sentences. Focus on the advertised effort-to-reward bargain.
      placeholder: Five jobs in one title, client escalation duty, and weekend availability for coordinator pay.
    validations:
      required: true

  - type: checkboxes
    id: awards
    attributes:
      label: Possible awards
      description: Pick any that seem earned. Final awards can change during review.
      options:
        - label: "🏔 Moving Mountains Award"
        - label: "📨 Human Router Award"
        - label: "🧢 Seven Jobs in a Trench Coat"
        - label: "🔥 Everything Is Urgent Award"
        - label: "👑 Royal Servant Award"
        - label: "📊 Spreadsheet Atlas Award"
        - label: "🫠 Competence Tax Award"
        - label: "💰 Surely There's Equity? Award"
        - label: "🎓 Degree Required to Send Follow-Ups Award"

  - type: textarea
    id: archive
    attributes:
      label: Archive / backup evidence
      description: Optional. Add an archived URL, screenshot reference, or other public backup in case the posting disappears.
      placeholder: Archived URL or notes

  - type: checkboxes
    id: attestation
    attributes:
      label: Submission check
      options:
        - label: This submission describes a publicly advertised role and contains no private employee information.
          required: true
        - label: I summarized the posting faithfully and kept quoted material short.
          required: true
